<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Medieval Pixel Open World</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: 'Courier New', monospace; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; image-rendering: pixelated; image-rendering: crisp-edges; }
    
    #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 10; }
    
    #joystick {
      position: absolute; bottom: 30px; left: 30px; width: 100px; height: 100px;
      background: rgba(0,0,0,0.4); border: 3px solid rgba(255,255,255,0.8);
      border-radius: 50%; touch-action: none; pointer-events: auto;
    }
    #stick {
      position: absolute; top: 25px; left: 25px; width: 50px; height: 50px;
      background: rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none;
    }
    #jump {
      position: absolute; bottom: 40px; right: 40px; width: 80px; height: 80px;
      background: rgba(0,0,0,0.4); border: 3px solid rgba(255,255,255,0.8);
      border-radius: 50%; color: white; font-size: 16px; font-weight: bold;
      display: flex; align-items: center; justify-content: center; 
      touch-action: none; pointer-events: auto; user-select: none;
      font-family: monospace; text-shadow: 2px 2px 0 #000;
    }
    #jump:active { background: rgba(255,255,255,0.3); }
    
    #hud {
      position: absolute; top: 10px; left: 10px; color: #fff;
      text-shadow: 2px 2px 0 #000; font-size: 14px; line-height: 1.4;
      pointer-events: none; background: rgba(0,0,0,0.5); padding: 10px; border-radius: 5px;
    }
    
    #loading {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #fff; font-size: 20px; font-weight: bold; text-align: center;
      text-shadow: 3px 3px 0 #000; background: rgba(0,0,0,0.7); padding: 30px;
      border: 4px solid #fff; z-index: 100; font-family: monospace; letter-spacing: 2px;
    }
    #loading.hidden { display: none; }
    #error {
      position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      color: #ff4444; font-size: 14px; font-weight: bold; text-align: center;
      background: #000; padding: 20px; border: 2px solid #ff4444; z-index: 200;
      display: none; word-break: break-all; font-family: monospace;
    }
  </style>
</head>
<body>
  <div id="error">ERROR: <span id="error-msg"></span></div>
  <div id="loading">GENERATING WORLD...<br><span id="progress" class="blink">LOADING</span></div>
  
  <div id="ui-layer">
    <div id="hud" style="display:none;">
      WASD: MOVE<br>
      DRAG: LOOK<br>
      SPACE: JUMP
    </div>
    <div id="joystick" style="display:none;"><div id="stick"></div></div>
    <div id="jump" style="display:none;">JUMP</div>
  </div>

  <!-- Use a single, stable UMD build of Three.js (No ES Modules, no import maps) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script>
    // Error Handling
    window.onerror = function(msg) {
      document.getElementById('error').style.display = 'block';
      document.getElementById('error-msg').innerText = msg;
      console.error(msg);
    };

    // ==========================================
    // 1. CONFIGURATION & GLOBAL STATE
    // ==========================================
    const CHUNK_SIZE = 100;
    const VIEW_DISTANCE = 2; // Kept small for mobile performance
    const TERRAIN_SEGMENTS = 12;
    const WORLD_SIZE = 5000;
    const HALF_WORLD = WORLD_SIZE / 2;

    let scene, camera, renderer;
    let player, water, sunLight, ambientLight, cloudMesh;
    const clock = new THREE.Clock();
    
    const chunks = new Map();
    const chunkQueue = [];
    
    const playerState = {
      velocityY: 0, isGrounded: false, moveSpeed: 12, jumpForce: 10, gravity: -30
    };

    const cameraState = {
      theta: Math.PI, phi: Math.PI / 3, distance: 12, target: new THREE.Vector3()
    };

    const keys = { w: false, a: false, s: false, d: false, space: false };
    let joyVec = { x: 0, y: 0 };
    let isDraggingCamera = false;
    let prevTouch = { x: 0, y: 0 };
    let isMouseDown = false;
    let timeOfDay = 0.25;

    // ==========================================
    // 2. PROCEDURAL NOISE
    // ==========================================
    function noise(x, z) {
      let y = 0;
      y += Math.sin(x * 0.001) * Math.cos(z * 0.001) * 50;
      y += Math.sin(x * 0.005) * Math.cos(z * 0.005) * 15;
      y += Math.sin(x * 0.01) * Math.cos(z * 0.01) * 8;
      y += Math.sin(x * 0.05) * Math.cos(z * 0.05) * 2;
      return y;
    }

    function riverNoise(x, z) {
      return Math.sin(x * 0.002) * Math.cos(z * 0.002) * 3 + 
             Math.sin(x * 0.005) * Math.cos(z * 0.005) * 1.5;
    }

    function roadNoise(x, z) {
      return Math.sin(x * 0.001) * 0.5 + Math.cos(z * 0.001) * 0.5;
    }

    function getTerrainHeight(x, z) {
      let h = noise(x, z);
      const r = riverNoise(x, z);
      if (r > 1.5 && r < 2.5) h -= (2.5 - Math.abs(r - 2)) * 20;
      if (r > -2.5 && r < -1.5) h -= (2.5 - Math.abs(r + 2)) * 20;
      const road = Math.abs(roadNoise(x, z));
      if (road < 0.05) h = Math.min(h, 5);
      return h;
    }

    // ==========================================
    // 3. PIXEL ART TEXTURES
    // ==========================================
    function createPixelTexture(base, shade, size = 16, pattern = 'noise') {
      const canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = base; ctx.fillRect(0, 0, size, size);
      ctx.fillStyle = shade;
      if (pattern === 'noise') {
        for (let i = 0; i < 50; i++) {
          const x = Math.floor(Math.random() * size); const y = Math.floor(Math.random() * size);
          ctx.fillRect(x, y, Math.random() > 0.8 ? 2 : 1, Math.random() > 0.8 ? 2 : 1);
        }
      } else if (pattern === 'stripes') {
        for (let i = 0; i < size; i += 4) ctx.fillRect(0, i, size, 2);
      } else if (pattern === 'bricks') {
        for (let y = 0; y < size; y += 4) for (let x = 0; x < size; x += 8) ctx.fillRect(x, y, 6, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.magFilter = THREE.NearestFilter; tex.minFilter = THREE.NearestFilter;
      return tex;
    }

    const texGrass = createPixelTexture('#4a7c3f', '#3a6332');
    const texDarkGrass = createPixelTexture('#2a4a1e', '#1a3a12');
    const texStone = createPixelTexture('#7a7a7a', '#5a5a5a');
    const texSand = createPixelTexture('#d4c48a', '#b4a46a');
    const texWater = createPixelTexture('#2389da', '#1a6ba8', 32, 'noise');
    const texWood = createPixelTexture('#5c4033', '#3e2a1e', 16, 'stripes');
    const texLeaves = createPixelTexture('#2d5a27', '#1e3a1a');
    const texBrick = createPixelTexture('#8b4513', '#6b3510', 16, 'bricks');
    const texThatch = createPixelTexture('#daa520', '#b8860b', 16, 'stripes');
    const texCloud = createPixelTexture('#ffffff', '#e0e0e0', 32, 'noise');

    const matWood = new THREE.MeshLambertMaterial({ map: texWood, flatShading: true });
    const matLeaves = new THREE.MeshLambertMaterial({ map: texLeaves, flatShading: true });
    const matStone = new THREE.MeshLambertMaterial({ map: texStone, flatShading: true });
    const matBrick = new THREE.MeshLambertMaterial({ map: texBrick, flatShading: true });
    const matThatch = new THREE.MeshLambertMaterial({ map: texThatch, flatShading: true });
    const matWater = new THREE.MeshBasicMaterial({ map: texWater, transparent: true, opacity: 0.8, depthWrite: false });

    // ==========================================
    // 4. CHUNK GENERATION
    // ==========================================
    function generateChunk(cx, cz) {
      const group = new THREE.Group();
      const offsetX = cx * CHUNK_SIZE;
      const offsetZ = cz * CHUNK_SIZE;

      const geo = new THREE.PlaneGeometry(CHUNK_SIZE, CHUNK_SIZE, TERRAIN_SEGMENTS, TERRAIN_SEGMENTS);
      geo.rotateX(-Math.PI / 2);
      const pos = geo.attributes.position;
      const colors = [];
      
      for (let i = 0; i < pos.count; i++) {
        const x = pos.getX(i) + offsetX;
        const z = pos.getZ(i) + offsetZ;
        const y = getTerrainHeight(x, z);
        pos.setY(i, y);
        const r = riverNoise(x, z);
        const road = Math.abs(roadNoise(x, z));
        
        if (road < 0.03) colors.push(0.6, 0.5, 0.4);
        else if (y < -2) colors.push(0.83, 0.77, 0.54);
        else if (y < 5 && r > 1.5 && r < 2.5) colors.push(0.15, 0.35, 0.15);
        else if (y < 25) {
          const darkForest = Math.sin(x * 0.01) * Math.cos(z * 0.01);
          if (darkForest > 0.4) colors.push(0.16, 0.29, 0.12);
          else colors.push(0.29, 0.49, 0.25);
        }
        else if (y < 45) colors.push(0.48, 0.48, 0.48);
        else colors.push(0.9, 0.9, 0.9);
      }
      
      geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
      geo.computeVertexNormals();

      const terrainMat = new THREE.MeshLambertMaterial({ vertexColors: true, flatShading: true });
      const terrain = new THREE.Mesh(geo, terrainMat);
      terrain.receiveShadow = true;
      group.add(terrain);

      // Trees
      const treeCount = 8;
      const treeGeo = new THREE.BoxGeometry(0.8, 4, 0.8);
      const treeMesh = new THREE.InstancedMesh(treeGeo, matWood, treeCount);
      const leafGeo = new THREE.BoxGeometry(2.5, 1.5, 2.5);
      const leafMesh = new THREE.InstancedMesh(leafGeo, matLeaves, treeCount * 3);
      const dummy = new THREE.Object3D();
      let treeIdx = 0, leafIdx = 0;

      for (let i = 0; i < treeCount; i++) {
        const tx = offsetX + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2;
        const tz = offsetZ + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2;
        const ty = getTerrainHeight(tx, tz);
        if (ty < -1 || ty > 35 || Math.abs(roadNoise(tx, tz)) < 0.05) continue;
        
        dummy.position.set(tx, ty + 2, tz); dummy.rotation.y = Math.random() * Math.PI; dummy.updateMatrix();
        treeMesh.setMatrixAt(treeIdx++, dummy.matrix);
        for (let j = 0; j < 3; j++) {
          dummy.position.set(tx, ty + 4 + j * 1.2, tz);
          const s = 1 - j * 0.2; dummy.scale.set(s, 1, s); dummy.updateMatrix();
          leafMesh.setMatrixAt(leafIdx++, dummy.matrix);
        }
      }
      treeMesh.instanceMatrix.needsUpdate = true; leafMesh.instanceMatrix.needsUpdate = true;
      group.add(treeMesh); group.add(leafMesh);

      // Rocks
      const rockCount = 4;
      const rockGeo = new THREE.BoxGeometry(1.5, 1, 1.5);
      const rockMesh = new THREE.InstancedMesh(rockGeo, matStone, rockCount);
      let rockIdx = 0;
      for (let i = 0; i < rockCount; i++) {
        const rx = offsetX + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2;
        const rz = offsetZ + Math.random() * CHUNK_SIZE - CHUNK_SIZE / 2;
        const ry = getTerrainHeight(rx, rz);
        if (ry < -0.5 || ry > 40) continue;
        dummy.position.set(rx, ry + 0.5, rz); dummy.rotation.y = Math.random() * Math.PI; dummy.scale.set(1,1,1); dummy.updateMatrix();
        rockMesh.setMatrixAt(rockIdx++, dummy.matrix);
      }
      rockMesh.instanceMatrix.needsUpdate = true;
      group.add(rockMesh);

      // Structures
      const structNoise = Math.sin(cx * 1.7) * Math.cos(cz * 1.3);
      if (structNoise > 0.8 && Math.abs(roadNoise(offsetX, offsetZ)) < 0.1) group.add(createCastle(offsetX, offsetZ));
      else if (structNoise > 0.4) group.add(createSettlement(offsetX, offsetZ));

      // Animals
      if (Math.random() > 0.6) group.add(createSheep(offsetX + Math.random() * 80 - 40, offsetZ + Math.random() * 80 - 40));
      if (Math.random() > 0.7) group.add(createDeer(offsetX + Math.random() * 80 - 40, offsetZ + Math.random() * 80 - 40));

      return group;
    }

    // ==========================================
    // 5. MEDIEVAL STRUCTURES
    // ==========================================
    function createCastle(x, z) {
      const castle = new THREE.Group();
      const y = getTerrainHeight(x, z);
      castle.position.set(x, y, z);

      const keep = new THREE.Mesh(new THREE.BoxGeometry(12, 18, 12), matBrick);
      keep.position.y = 9; keep.castShadow = true; keep.receiveShadow = true; castle.add(keep);

      [[-9, -9], [9, -9], [-9, 9], [9, 9]].forEach(p => {
        const tower = new THREE.Mesh(new THREE.CylinderGeometry(2.5, 2.5, 24, 8), matBrick);
        tower.position.set(p[0], 12, p[1]); tower.castShadow = true; castle.add(tower);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(3, 4, 8), matThatch);
        roof.position.set(p[0], 25, p[1]); roof.castShadow = true; castle.add(roof);
      });

      const wallGeo1 = new THREE.BoxGeometry(24, 8, 1.5);
      const wall1 = new THREE.Mesh(wallGeo1, matBrick); wall1.position.set(0, 4, -12); wall1.castShadow = true; castle.add(wall1);
      const wall2 = new THREE.Mesh(wallGeo1, matBrick); wall2.position.set(0, 4, 12); wall2.castShadow = true; castle.add(wall2);
      const wallGeo2 = new THREE.BoxGeometry(1.5, 8, 24);
      const wall3 = new THREE.Mesh(wallGeo2, matBrick); wall3.position.set(-12, 4, 0); wall3.castShadow = true; castle.add(wall3);
      const wall4 = new THREE.Mesh(wallGeo2, matBrick); wall4.position.set(12, 4, 0); wall4.castShadow = true; castle.add(wall4);

      for (let i = 0; i < 3; i++) castle.add(createNPC(x + (Math.random() - 0.5) * 25, z + (Math.random() - 0.5) * 25));
      return castle;
    }

    function createSettlement(x, z) {
      const settlement = new THREE.Group();
      const y = getTerrainHeight(x, z);
      settlement.position.set(x, y, z);

      const houseCount = 4 + Math.floor(Math.random() * 3);
      for (let i = 0; i < houseCount; i++) {
        const hx = (Math.random() - 0.5) * 40;
        const hz = (Math.random() - 0.5) * 40;
        const hy = getTerrainHeight(x + hx, z + hz);
        const house = new THREE.Group();
        house.position.set(hx, hy, hz); house.rotation.y = Math.random() * Math.PI;
        const base = new THREE.Mesh(new THREE.BoxGeometry(6, 5, 6), matWood);
        base.position.y = 2.5; base.castShadow = true; base.receiveShadow = true; house.add(base);
        const roof = new THREE.Mesh(new THREE.ConeGeometry(5, 4, 4), matThatch);
        roof.position.y = 6.5; roof.rotation.y = Math.PI / 4; roof.castShadow = true; house.add(roof);
        settlement.add(house);
      }
      for (let i = 0; i < 5; i++) settlement.add(createNPC(x + (Math.random() - 0.5) * 40, z + (Math.random() - 0.5) * 40));
      return settlement;
    }

    // ==========================================
    // 6. FACELESS LIVING THINGS (Islamic Compliance)
    // ==========================================
    function createSheep(x, z) {
      const sheep = new THREE.Group();
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0xffffff, flatShading: true });
      const headMat = new THREE.MeshLambertMaterial({ color: 0x444444, flatShading: true });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1.6, 1.2, 2.4), bodyMat); body.position.y = 1; body.castShadow = true; sheep.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.9, 0.9), headMat); head.position.set(0, 1.4, -1.5); head.castShadow = true; sheep.add(head);
      [[-0.5, 0.5, -0.8], [0.5, 0.5, -0.8], [-0.5, 0.5, 0.8], [0.5, 0.5, 0.8]].forEach(p => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1, 0.3), headMat); leg.position.set(p[0], p[1], p[2]); leg.castShadow = true; sheep.add(leg);
      });
      sheep.position.set(x, getTerrainHeight(x, z), z); return sheep;
    }

    function createDeer(x, z) {
      const deer = new THREE.Group();
      const bodyMat = new THREE.MeshLambertMaterial({ color: 0x8b5a2b, flatShading: true });
      const headMat = new THREE.MeshLambertMaterial({ color: 0x5a3a1b, flatShading: true });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 2.2), bodyMat); body.position.y = 1.6; body.castShadow = true; deer.add(body);
      const neck = new THREE.Mesh(new THREE.BoxGeometry(0.6, 1.2, 0.6), headMat); neck.position.set(0, 2.4, -1); neck.castShadow = true; deer.add(neck);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.7, 0.8), headMat); head.position.set(0, 3, -1); head.castShadow = true; deer.add(head);
      const antlerMat = new THREE.MeshLambertMaterial({ color: 0xd2b48c, flatShading: true });
      const a1 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1, 0.15), antlerMat); a1.position.set(0.3, 3.5, -1); deer.add(a1);
      const a2 = new THREE.Mesh(new THREE.BoxGeometry(0.15, 1, 0.15), antlerMat); a2.position.set(-0.3, 3.5, -1); deer.add(a2);
      [[-0.4, 0.8, -0.7], [0.4, 0.8, -0.7], [-0.4, 0.8, 0.7], [0.4, 0.8, 0.7]].forEach(p => {
        const leg = new THREE.Mesh(new THREE.BoxGeometry(0.3, 1.6, 0.3), headMat); leg.position.set(p[0], p[1], p[2]); leg.castShadow = true; deer.add(leg);
      });
      deer.position.set(x, getTerrainHeight(x, z), z); return deer;
    }

    function createNPC(x, z) {
      const npc = new THREE.Group();
      const skinMat = new THREE.MeshLambertMaterial({ color: 0xdeb887, flatShading: true });
      const tunicMat = new THREE.MeshLambertMaterial({ color: 0x8b4513, flatShading: true });
      const body = new THREE.Mesh(new THREE.BoxGeometry(1, 1.6, 0.6), tunicMat); body.position.y = 1.8; body.castShadow = true; npc.add(body);
      const head = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.8, 0.8), skinMat); head.position.y = 3; head.castShadow = true; npc.add(head);
      const armGeo = new THREE.BoxGeometry(0.35, 1.3, 0.35);
      const leftArm = new THREE.Mesh(armGeo, skinMat); leftArm.position.set(-0.8, 1.8, 0); leftArm.castShadow = true; npc.add(leftArm);
      const rightArm = new THREE.Mesh(armGeo, skinMat); rightArm.position.set(0.8, 1.8, 0); rightArm.castShadow = true; npc.add(rightArm);
      const legMat = new THREE.MeshLambertMaterial({ color: 0x333333, flatShading: true });
      const legGeo = new THREE.BoxGeometry(0.4, 1.2, 0.4);
      const leftLeg = new THREE.Mesh(legGeo, legMat); leftLeg.position.set(-0.3, 0.6, 0); leftLeg.castShadow = true; npc.add(leftLeg);
      const rightLeg = new THREE.Mesh(legGeo, legMat); rightLeg.position.set(0.3, 0.6, 0); rightLeg.castShadow = true; npc.add(rightLeg);
      npc.position.set(x, getTerrainHeight(x, z), z); return npc;
    }

    // ==========================================
    // 7. INITIALIZATION & CHUNK MANAGEMENT
    // ==========================================
    function init() {
      try {
        const renderWidth = 320, renderHeight = 180;
        renderer = new THREE.WebGLRenderer({ antialias: false });
        renderer.setSize(renderWidth, renderHeight, false);
        renderer.domElement.style.width = '100vw';
        renderer.domElement.style.height = '100vh';
        renderer.domElement.style.imageRendering = 'pixelated';
        renderer.setClearColor(0x87ceeb);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.BasicShadowMap;
        document.body.appendChild(renderer.domElement);

        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.Fog(0x87ceeb, 50, 150);

        camera = new THREE.PerspectiveCamera(70, renderWidth / renderHeight, 0.1, 500);
        camera.position.set(0, 20, 20);

        ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
        sunLight = new THREE.DirectionalLight(0xffffff, 0.8);
        sunLight.position.set(50, 100, 50); sunLight.castShadow = true;
        sunLight.shadow.mapSize.width = 1024; sunLight.shadow.mapSize.height = 1024;
        sunLight.shadow.camera.left = -60; sunLight.shadow.camera.right = 60;
        sunLight.shadow.
